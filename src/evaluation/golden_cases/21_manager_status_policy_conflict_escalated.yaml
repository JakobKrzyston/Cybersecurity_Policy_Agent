policy_chunks:
  - id: "4.4"
    text: "§4.4. A verified manager may confirm whether an employee in their direct reporting chain is currently active. The agent must verify the manager is in the reporting chain before disclosing status."
    tags: [hr, manager, employment-status]
  - id: "4.2"
    text: "§4.2. Salary, compensation details, performance ratings, and employment status change information are restricted fields. The agent must not retrieve or disclose these for any requester other than the employee themselves or HR personnel with documented need."
    tags: [hr, restricted, employment-status]
  - id: "5.3"
    text: "§5.3. When the agent cannot verify the requester's identity, authorization, or business justification with sufficient confidence, it must escalate to a human operator rather than deny or approve unilaterally."
    tags: [escalation, ambiguous, policy-conflict]
